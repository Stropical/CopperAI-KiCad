[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schematic-gym"
version = "0.1.0"
description = "Gymnasium environment for KiCad schematic capture"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0.0",
    "cairocffi>=1.6.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-benchmark>=4.0"]
all = ["schematic-gym[dev]"]

[project.entry-points."gymnasium.envs"]
SchematicGym-v0 = "schematic_gym.env:SchematicGymEnv"

[tool.uv]
package = false
