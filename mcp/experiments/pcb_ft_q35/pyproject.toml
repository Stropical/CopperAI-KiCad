[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-ft-q35"
version = "0.1.0"
description = "Scaffolding for the pcb_ft_q35 training package."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "transformers>=4.45",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]
unsloth = [
  "unsloth",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
