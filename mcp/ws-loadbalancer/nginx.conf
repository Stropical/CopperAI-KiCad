# Nginx WebSocket load balancer for Copper AI agents
# Note: worker_connections is set in /etc/nginx/nginx.conf (not this conf.d include).
# To raise worker_connections for 1000s of WS connections, set events { worker_connections 4096; }
# in the main nginx.conf (or use a custom nginx.conf via the Dockerfile).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker embedded DNS. Using resolver + variable proxy_pass ensures upstream
# hostnames are re-resolved when container IPs change.
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 9090;
    server_name _;

    # Health check for the LB itself
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    # WebSocket proxy
    location / {
        set $agent_upstream http://agent:3000;
        proxy_pass $agent_upstream;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Pass real client IP for ip_hash
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        # Long timeouts for agent sessions (35 min to cover pipeline default of 30 min)
        proxy_read_timeout 2100s;
        proxy_send_timeout 2100s;

        # Don't buffer WebSocket frames
        proxy_buffering off;
    }
}
